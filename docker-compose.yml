version: '3.8'

services:
  # Tu aplicación
  homeblinds-facturacion:
    container_name: homeblinds-facturacion
    build:
      context: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - API_KEY=${API_KEY}
    networks:
      - app-network
    restart: unless-stopped

  # Cloudflare Tunnel - expone la app a internet con tu dominio
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homeblinds-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - homeblinds-facturacion

networks:
  app-network:
    driver: bridge
