version: '3.8'

services:
  # Tu aplicación
  homeblinds-facturacion:
    container_name: homeblinds-facturacion
    build:
      context: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - API_KEY=${API_KEY}
    networks:
      - app-network
    restart: unless-stopped

  # ngrok tunnel - expone la app a internet
  ngrok:
    image: ngrok/ngrok:latest
    container_name: homeblinds-ngrok
    command: http homeblinds-facturacion:3000
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - '4040:4040'  # Panel de inspección local
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - homeblinds-facturacion

networks:
  app-network:
    driver: bridge
